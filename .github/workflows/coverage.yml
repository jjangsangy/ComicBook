name: Coverage

# Coverage lives in its own workflow so a failing 95% gate reddens the dedicated
# coverage badge/check without taking the main `CI` badge down with it.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    # A single Linux job is enough: the instrumented run is far slower than the
    # plain test matrix, and coverage does not vary meaningfully by OS.
    runs-on: ubuntu-latest
    # Total region-coverage floor. `--fail-under-regions` below makes the job — and so
    # its `Coverage` status check — fail when total region coverage is under it. Region
    # coverage is llvm-cov's strictest metric (a partially executed line is not counted
    # as fully covered). Codecov cannot represent LLVM regions, so its badge reports
    # *line* coverage instead and will differ — see docs/development.md.
    env:
      MIN_REGION_COVERAGE: 95
    permissions:
      contents: read
      # The sticky pull-request comment.
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # `cargo-llvm-cov` drives `llvm-cov`/`llvm-profdata`, which live in the
      # `llvm-tools-preview` rustup component rather than the default profile.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # One instrumented run of the whole suite, reusing the test matrix's
      # `--no-fail-fast` policy so a single failure still lets every remaining test
      # record its coverage. `--fail-under-regions` is the gate: the run exits non-zero
      # when total region coverage is below `MIN_REGION_COVERAGE`, which reddens the job
      # and its status check. `lcov.info` is the machine-readable artifact (uploaded to
      # Codecov); the tables below are rendered from the same profile data, so they are
      # still published when the gate fails.
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --no-fail-fast --fail-under-regions "$MIN_REGION_COVERAGE" --lcov --output-path lcov.info

      # Feeds the badge and the Codecov dashboard/PR annotations from `lcov.info`.
      # Authenticated with the `CODECOV_TOKEN` repository secret (required
      # because a public repo still needs auth on a protected branch like
      # `main`). `if: always()` keeps the badge current even when the gate fails;
      # a Codecov outage stays non-blocking because `fail_ci_if_error` is false
      # (flip it to true to fail the job on a bad or missing token instead).
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # `cargo llvm-cov report` re-renders the profile data from the run above
      # without rerunning the tests, so this still reports even when that run
      # failed. `--color never` keeps ANSI escapes out of the markdown, and the
      # `available` output lets the later report steps skip when a build failure
      # left no profile data at all. The headline repeats the gate's region figure;
      # the Codecov badge reports line coverage, which is a different metric.
      - name: Write coverage summary
        id: coverage
        if: always()
        run: |
          if report="$(cargo llvm-cov report --color never 2>&1)"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            report="Coverage report unavailable; see the 'Run tests with coverage' step."
          fi
          regions="$(printf '%s\n' "$report" | awk '/^TOTAL/{print $4; exit}')"
          [ -n "$regions" ] || regions="unavailable"
          {
            echo "## Code coverage"
            echo
            echo "**Region coverage (the gate): ${regions}. Floor: ${MIN_REGION_COVERAGE}%.**"
            echo
            echo "The Codecov badge reports *line* coverage, a different metric — Codecov has no region concept."
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Code coverage"
            echo
            echo "**Region coverage (the gate): ${regions}. Floor: ${MIN_REGION_COVERAGE}%.**"
            echo
            echo "The Codecov badge reports *line* coverage, a different metric — Codecov has no region concept."
            echo
            echo '```'
            echo "$report"
            echo '```'
            echo
            echo '_Generated by [`cargo llvm-cov`](https://github.com/taiki-e/cargo-llvm-cov) with [nextest](https://nexte.st/)._'
          } > coverage-comment.md

      - name: Generate HTML coverage report
        if: always() && steps.coverage.outputs.available == 'true'
        run: cargo llvm-cov report --html --output-dir coverage-html

      # Same-repo pull requests only: a pull request opened from a fork gets a
      # read-only `GITHUB_TOKEN`, which cannot write the comment. The job summary
      # is still produced for forks.
      - name: Comment coverage on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-coverage
          path: coverage-comment.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage-comment.md
            coverage-html/
          if-no-files-found: ignore
