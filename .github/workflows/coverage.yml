name: Coverage

# Coverage lives in its own workflow so a failing coverage gate reddens the
# dedicated `codecov/project` check without taking the main `CI` badge down.
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Coverage
    # A single Linux job is enough: the instrumented run is far slower than the
    # plain test matrix, and coverage does not vary meaningfully by OS.
    runs-on: ubuntu-latest
    # The coverage floor is enforced by Codecov, not here: the uploaded `lcov.info`
    # is scored by the `codecov/project` status configured in `codecov.yml`, so the
    # gate and the README badge are the same number. See docs/development.md.
    permissions:
      contents: read
      # The sticky pull-request comment.
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # `cargo-llvm-cov` drives `llvm-cov`/`llvm-profdata`, which live in the
      # `llvm-tools-preview` rustup component rather than the default profile.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # One instrumented run of the whole suite, reusing the test matrix's
      # `--no-fail-fast` policy so a single failure still lets every remaining test
      # record its coverage. This step fails only on a test failure; the coverage
      # floor is enforced downstream by the Codecov status, which scores the
      # `lcov.info` written here (see `codecov.yml`).
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --no-fail-fast --lcov --output-path lcov.info

      # Source of truth for the coverage gate. The `codecov/project` status
      # (configured in `codecov.yml`) fails when coverage is under its target, and
      # the README badge is rendered from this same upload, so the gate and the badge
      # cannot disagree. Authenticated with the `CODECOV_TOKEN` repository secret
      # (required because a public repo still needs auth on a protected branch like
      # `main`). `if: always()` keeps the badge current even when a test fails;
      # `fail_ci_if_error` stays false so a Codecov outage does not redden the job
      # (flip it to true to fail on a bad or missing token instead).
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # `cargo llvm-cov report` re-renders the profile data from the run above
      # without rerunning the tests, so this still reports even when that run
      # failed. `--color never` keeps ANSI escapes out of the markdown, and the
      # `available` output lets the later report steps skip when a build failure
      # left no profile data at all. The headline is the *line* figure Codecov gates
      # on, recomputed from the lcov `DA:` records so it matches the badge exactly —
      # truncated to two decimals, as Codecov does (llvm-cov's own `Lines` column
      # counts differently and would not match).
      - name: Write coverage summary
        id: coverage
        if: always()
        run: |
          if report="$(cargo llvm-cov report --color never 2>&1)"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            report="Coverage report unavailable; see the 'Run tests with coverage' step."
          fi
          if [ -f lcov.info ]; then
            lines="$(awk -F'[,:]' '/^DA:/{n++; if ($3+0>0) h++} END{if (n) printf "%.2f%% (%d/%d)", int(h*10000/n)/100, h, n; else print "unavailable"}' lcov.info)"
          else
            lines="unavailable"
          fi
          {
            echo "## Code coverage"
            echo
            echo "**Line coverage (the Codecov gate): ${lines}.**"
            echo
            echo "This is the figure Codecov scores from lcov.info; the codecov/project status (see codecov.yml) is the gate."
            echo
            echo '```'
            echo "$report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Code coverage"
            echo
            echo "**Line coverage (the Codecov gate): ${lines}.**"
            echo
            echo "This is the figure Codecov scores from lcov.info; the codecov/project status (see codecov.yml) is the gate."
            echo
            echo '```'
            echo "$report"
            echo '```'
            echo
            echo '_Generated by [`cargo llvm-cov`](https://github.com/taiki-e/cargo-llvm-cov) with [nextest](https://nexte.st/)._'
          } > coverage-comment.md

      - name: Generate HTML coverage report
        if: always() && steps.coverage.outputs.available == 'true'
        run: cargo llvm-cov report --html --output-dir coverage-html

      # Same-repo pull requests only: a pull request opened from a fork gets a
      # read-only `GITHUB_TOKEN`, which cannot write the comment. The job summary
      # is still produced for forks.
      - name: Comment coverage on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-coverage
          path: coverage-comment.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            lcov.info
            coverage-comment.md
            coverage-html/
          if-no-files-found: ignore
