name: Release

# Builds prebuilt binaries for every supported platform, attaches them to the
# GitHub Release for the pushed tag, and commits the tag's version to the default
# branch. Pushing a tag such as `v0.1.0` is all that is required.
on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: comic-book
  # Crate name, used to refresh the matching Cargo.lock entry after the version
  # is stamped from the tag.
  PKG_NAME: comic-book

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Fails before the GitHub Release exists if the tag is not a version Cargo
      # accepts: the `v[0-9]+.*` trigger still admits things like `v1.2`.
      - name: Check the tag is a valid SemVer version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/set-version.sh --check "$RELEASE_TAG"

  create-release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The release page carries the changelog for the tag's whole major.minor
      # line — its own `Unreleased` section plus every older 0.Y.x entry — taken
      # from the tagged CHANGELOG.md. The action prepends this body to GitHub's
      # generated notes, so the auto "What's Changed" / "Full Changelog" section
      # still follows. An empty file falls back to the generated notes alone.
      - name: Build release notes from the changelog
        shell: bash
        run: ./scripts/changelog-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          draft: false
          # Tags like `v0.2.0-rc.1` are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # unrar_sys compiles its vendored C++ with a bare `-std=c++14` invocation
      # that neither defines the platform endianness (so unrar's os.hpp #errors
      # out on aarch64) nor makes `<cstddef>`'s global `ptrdiff_t` visible (which
      # old libstdc++ only declares as `std::ptrdiff_t`, breaking cmddata.cpp).
      # Also set in .cargo/config.toml; repeated here so the release does not
      # depend on Cargo propagating `[env]` into dependency build scripts.
      # Ignored by every other target.
      CXXFLAGS_aarch64_unknown_linux_gnu: "-DLITTLE_ENDIAN -include cstddef"
      CXXFLAGS_aarch64_unknown_linux_musl: "-DLITTLE_ENDIAN -include cstddef"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (glibc) — x86_64 is built natively, aarch64 via `cross`.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

          # Linux (musl) — statically linked, runs on any distribution.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest

          # macOS — `macos-latest` is arm64, so x86_64 is cross-compiled.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # The crate version must equal the released tag so the compiled binaries
      # report it from `comic-book --version`. The tag is the source of truth:
      # the manifest is stamped from it here rather than trusted to have been
      # bumped by hand before tagging. Cargo.lock is then refreshed so the
      # `--locked` build inside the action below still succeeds.
      - name: Set version from tag (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/set-version.sh "$RELEASE_TAG"

      - name: Set version from tag (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/set-version.ps1 "$env:RELEASE_TAG"

      - name: Refresh Cargo.lock
        run: cargo update -p ${{ env.PKG_NAME }}

      # Builds the binary, packaging it as `comic-book-<target>.tar.gz` (Unix) or
      # `.zip` (Windows), writes a matching `.sha256`, and uploads both to the
      # release created above. Cross-compilation falls back to `cross`
      # automatically, which is installed on demand.
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ env.BIN_NAME }}
          target: ${{ matrix.target }}
          archive: ${{ env.BIN_NAME }}-${{ matrix.target }}
          # Unix targets ship a .tar.gz, Windows a .zip (the action defaults).
          tar: unix
          zip: windows
          include: LICENSE,README.md
          checksum: sha256
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Once every binary has built and uploaded, make the default branch declare the
  # released version and date the changelog. The build jobs above stamp the tag
  # into a throwaway checkout; this job commits the same stamp — plus the
  # changelog roll-over (`--changelog`) — so `main` reflects what was just
  # released instead of drifting until the next manual bump. `needs` means it
  # only runs when the whole build matrix succeeded.
  bump-version:
    name: Commit version bump to ${{ github.event.repository.default_branch }}
    needs: build-and-upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Stamp version from tag
        shell: bash
        run: ./scripts/set-version.sh --changelog "$RELEASE_TAG"

      - name: Refresh Cargo.lock
        run: cargo update -p ${{ env.PKG_NAME }}

      - name: Commit and push
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md; then
            echo "$DEFAULT_BRANCH already declares $RELEASE_TAG; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $RELEASE_TAG"
          git push origin "HEAD:$DEFAULT_BRANCH"
