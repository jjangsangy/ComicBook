[package]
name = "comic-book"
version = "0.1.0"
edition = "2021"
description = "Fast comic book archive conversion and image clamping CLI tool"
license = "MIT"
readme = "README.md"
keywords = ["comic", "cbz", "cbr", "image-processing", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif", "pnm"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
sevenz-rust2 = { version = "0.23", default-features = false, features = ["compress"] }
unrar = "0.5"
rars = "0.9"
rayon = "1.10"
indicatif = { version = "0.17", features = ["rayon"] }
natord = "1.0"
anyhow = "1.0"
tempfile = "3.17"
fast_image_resize = "5.1"
webp = "0.3"
walkdir = "2.5"
same-file = "1.0"
infer = "0.22.0"
# Image processing for `comic-book ebook` (AGENTS.md §7). `imageproc` supplies the
# contrast/threshold/filter primitives, `quantette` the fixed-palette quantisation and
# Floyd-Steinberg dithering. Both are MIT/Apache-2.0 and pure Rust.
imageproc = { version = "0.27", default-features = false, features = ["rayon"] }
quantette = { version = "0.6", default-features = false, features = ["image", "threads"] }
# Palette (indexed) PNG output; the `image` crate cannot write an indexed PNG.
png = "0.18"
# The moiré eraser (`--erase-rainbow`) transforms the luminance plane with a 2D
# FFT; AGENTS.md §7. Pure Rust, MIT/Apache-2.0.
rustfft = "6"
# Sub-byte PNG scanline packing for palette pages (AGENTS.md §15, Phase R). Already
# in the tree transitively via `quantette`; promoted to a direct dependency.
bitvec = "1"
# Phase 4: `ComicInfo.xml` parsing (AGENTS.md §7/§13.8). MIT, pure Rust.
quick-xml = "0.37"
# Phase 4: chapter-directory slugification (AGENTS.md §15, Phase R). `slug`
# transliterates Unicode to ASCII and collapses disallowed runs to single dashes,
# matching KCC's `python-slugify` call for the ASCII-alphanumeric case §13.8.1.
slug = "0.1"
# Phase 4: KCC's two number-padding substitutions in `slugify`. Already in the
# tree transitively via `unrar`; promoted to a direct dependency.
regex = "1"
# Phase 5: the EPUB `dc:identifier`/`dtb:uid` (`urn:uuid:<v4>`) and the
# `dcterms:modified` timestamp (AGENTS.md §7/§12.2). MIT/Apache-2.0, pure Rust.
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "macros"] }
# Phase 6: the generated EPUB/KePub documents (OPF/NCX/NAV/XHTML) are rendered
# from templates instead of being assembled with `push_str` (AGENTS.md §5.3).
# Askama compiles the templates into Rust, so there is no runtime parsing and a
# malformed template is a compile error. MIT OR Apache-2.0, pure Rust. Only the
# derive and `askama.toml` support are enabled; the templates carry their own
# XML/HTML text.
askama = { version = "0.16", default-features = false, features = ["config", "derive", "std"] }

[dev-dependencies]
libc = "0.2"
# Reading the EPUB container back in the Phase 5 structural tests; already a runtime
# dependency, re-declared here because integration tests cannot name it directly.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
