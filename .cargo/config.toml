# Build configuration.

# `unrar_sys`'s build script compiles its vendored unrar C++ sources with
# `-std=c++14` and defines no endianness macro of its own. In strict ISO C++
# mode glibc keeps `BYTE_ORDER`/`LITTLE_ENDIAN` hidden (`<sys/types.h>` only
# pulls in `<endian.h>` when `_DEFAULT_SOURCE`/`__USE_MISC` is active), and
# GCC's aarch64 backend predefines `__AARCH64EL__` but not `__LITTLE_ENDIAN__`
# (clang does predefine the latter, which is why the macOS builds are fine).
# unrar's `vendor/unrar/os.hpp` therefore cannot detect the endianness on
# aarch64 and trips its
#     #error "Neither LITTLE_ENDIAN nor BIG_ENDIAN are defined."
# in every translation unit, which surfaces as a cc-rs "command did not execute
# successfully" failure while compiling unrar_sys.
#
# Spelling the endianness out is exactly what upstream unrar asks callers to do
# on unfamiliar platforms. `CXXFLAGS_*` rather than `CFLAGS_*` scopes the define
# to C++ compilations, which for this dependency graph is unrar_sys alone.
[env]
CXXFLAGS_aarch64_unknown_linux_gnu = "-DLITTLE_ENDIAN"
